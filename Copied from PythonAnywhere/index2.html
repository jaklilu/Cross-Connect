<!DOCTYPE html>
<html>

<head>
  <title>Grids</title>
  <style>
    table {
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    td {
      border: 1px solid black;
      width: 50px;
      height: 50px;
      text-align: center;
    }

    td:nth-child(2) {
      background-color: green;
    }

    tr:nth-child(2) td {
      background-color: yellow;
    }

    tr:nth-child(2) td:nth-child(2) {
      font-weight: bold;
      background-color: red;
    }

    .grid-link {
      display: block;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  {% for grid in grids %}
  {% set middle_cell = grid[1][1] %}
  <a href="{{ url_for('grid', index=loop.index0) }}" class="grid-link">{{ middle_cell }}</a>
  <table>
    {% for row in grid %}
    <tr>
      {% for value in row %}
      <td>{% if value is none %}&nbsp;{% else %}{{ value }}{% endif %}</td>
      {% endfor %}
    </tr>
    {% endfor %}
  </table>
  {% endfor %}
</body>

</html>
