<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CrossConnect Admin</title>
  <style>
    body { background-color: black; color: white; font-family: Arial, sans-serif; margin: 24px; line-height: 1.4; }
    h1, h2 { color: green; }
    a { color: yellow; }
    .bar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 24px; }
    .flash { background-color: green; color: black; padding: 10px 14px; margin-bottom: 16px; font-weight: bold; }
    .flash.error { background-color: red; color: white; }
    .cards { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 28px; }
    .card { background: #111; border: 1px solid green; padding: 12px 16px; min-width: 120px; }
    .card strong { color: yellow; display: block; font-size: 22px; }
    section { background: #111; border: 1px solid #333; padding: 16px; margin-bottom: 20px; }
    label { display: block; margin: 8px 0 4px; }
    input[type="text"], input[type="password"], select, textarea {
      padding: 6px; font-size: 15px; min-width: 220px;
    }
    textarea { width: min(520px, 100%); height: 60px; }
    button { padding: 6px 12px; font-size: 14px; cursor: pointer; border: 0; background-color: green; color: white; }
    button.danger { background-color: red; }
    button.year { background-color: red; font-size: 16px; padding: 10px 18px; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #333; padding: 8px; text-align: left; vertical-align: middle; }
    th { background: #1a1a1a; color: yellow; }
    .row-form { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
    .help { color: #ccc; font-size: 14px; }
    .muted { color: #888; }
    #login-panel { max-width: 420px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="bar">
    <h1 style="margin: 0;">Manage CrossConnect</h1>
    <a href="/">View family site</a>
    <button id="sign-out" class="hidden" type="button">Sign out</button>
  </div>

  <div id="message"></div>

  <section id="login-panel">
    <h2>Sign in</h2>
    <p class="help">Use the admin password set in Netlify environment variables.</p>
    <label for="password">Password</label>
    <input id="password" type="password" autofocus>
    <div style="margin-top: 12px;"><button id="login-btn" type="button">Sign in</button></div>
  </section>

  <div id="admin-panel" class="hidden"></div>

  <script type="module" src="/js/admin.js"></script>
</body>
</html>
