<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Grid</title>
  <style>
    body { background-color: black; color: white; zoom: 250%; }
    table { border-collapse: collapse; margin-bottom: 20px; }
    td {
      border: 1px solid black;
      width: 100px;
      height: 100px;
      text-align: center;
    }
    td:nth-child(2) { background-color: green; }
    tr:nth-child(2) td { background-color: yellow; }
    tr:nth-child(2) td:nth-child(2) { font-weight: bold; background-color: red; }
    h1 { color: green; }
    h2 { color: yellow; cursor: pointer; }
    a { color: yellow; }
  </style>
</head>
<body>
  <p><a href="/">Back to all cards</a></p>
  <h1 style="font-size: 24px;">&nbsp;&nbsp;&nbsp;&nbsp;Here is your CrossConnect!</h1>
  <h2 id="tooltip-toggle" style="font-size: 30px;" title="CrossConnect is a platform for connecting people.">
    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
    <u>What is CrossConnect?</u>
  </h2>
  <div id="tooltip" style="display: none;">
    <p style="font-size: 30px;">The person on top, Appreciate them!</p>
    <p style="font-size: 30px;">The person on the bottom, Love them!</p>
    <p style="font-size: 30px;">The person on each side, Share something with them!</p>
  </div>
  <table id="grid"></table>
  <script type="module" src="/js/grid-page.js"></script>
</body>
</html>
