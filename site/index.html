<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>My Webpage</title>
  <style>
    body { background-color: black; color: white; }
    td {
      border: 1px solid black;
      width: 100px;
      height: 100px;
      text-align: center;
    }
    table { border-collapse: collapse; margin-bottom: 20px; }
    td:nth-child(2) { background-color: green; }
    tr:nth-child(2) td { background-color: yellow; }
    tr:nth-child(2) td:nth-child(2) { font-weight: bold; background-color: red; }
    .grid-link {
      display: block;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
      color: white;
      text-decoration: none;
    }
    h1 { color: green; }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .admin-link {
      color: yellow;
      font-weight: bold;
      text-decoration: none;
      border: 1px solid yellow;
      padding: 6px 12px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div>
      <h1 id="welcome" style="font-size: 24px; margin: 0;"></h1>
      <p id="intro"></p>
    </div>
    <a class="admin-link" href="/admin.html">Admin</a>
  </div>
  <div id="grids"></div>
  <script type="module" src="/js/index.js"></script>
</body>
</html>
