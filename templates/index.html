<!DOCTYPE html>
<html>
<head>
  <title>{{ site_title }}</title>
  <style>
    body {
      background-color: black;
    }
    td {
      border: 1px solid black;
      width: 100px;
      height: 100px;
      text-align: center;
    }
    table {
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    td:nth-child(2) {
      background-color: green;
    }
    tr:nth-child(2) td {
      background-color: yellow;
    }
    tr:nth-child(2) td:nth-child(2) {
      font-weight: bold;
      background-color: red;
    }
    .grid-link {
      display: block;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    h1 {
      color: green;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .admin-link {
      color: yellow;
      font-weight: bold;
      text-decoration: none;
      border: 1px solid yellow;
      padding: 6px 12px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div>
      <h1 style="font-size: 24px; margin: 0;">{{ welcome }}</h1>
      <p>{{ intro }}</p>
    </div>
    <a class="admin-link" href="/admin.html">Admin</a>
  </div>

  {% for grid in grids %}
  {% set middle_cell = grid[1][1] %}
  <a href="/grid/{{ loop.index0 }}" class="grid-link">{{ middle_cell }}</a>
  <table>
    {% for row in grid %}
    <tr>
      {% for value in row %}
      <td>{% if value is none %}&nbsp;{% else %}{{ value }}{% endif %}</td>
      {% endfor %}
    </tr>
    {% endfor %}
  </table>
  {% endfor %}
</body>
</html>
