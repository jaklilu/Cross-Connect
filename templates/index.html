<!DOCTYPE html>
<html>
<head>
  <title>{{ site_title }}</title>
  <style>
    body {
      background-color: black;
    }
    td {
      border: 1px solid black;
      width: 100px;
      height: 100px;
      text-align: center;
    }
    table {
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    td:nth-child(2) {
      background-color: green;
    }
    tr:nth-child(2) td {
      background-color: yellow;
    }
    tr:nth-child(2) td:nth-child(2) {
      font-weight: bold;
      background-color: red;
    }
    .grid-link {
      display: block;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    h1 {
      color: green;
    }
  </style>
</head>
<body>
  <h1 style="font-size: 24px;">{{ welcome }}</h1>
  <p>{{ intro }}</p>

  {% for grid in grids %}
  {% set middle_cell = grid[1][1] %}
  <a href="/grid/{{ loop.index0 }}" class="grid-link">{{ middle_cell }}</a>
  <table>
    {% for row in grid %}
    <tr>
      {% for value in row %}
      <td>{% if value is none %}&nbsp;{% else %}{{ value }}{% endif %}</td>
      {% endfor %}
    </tr>
    {% endfor %}
  </table>
  {% endfor %}
</body>
</html>
